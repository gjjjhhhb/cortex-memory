[server]
host = "127.0.0.1"
port = 8080
api_key = "cortex-local-dev-key"
default_context = "dev"
mcp_mode = "compact"

[database]
url = "surrealkv://./data/cortex.db"
namespace = "cortex"
database = "cortex"

[llm]
provider = "openai"
base_url = "env:LLM_BASE_URL"
api_key = "env:LLM_API_KEY"
model = "env:LLM_MODEL"
temperature = 0.0
structured_output_mode = "json_object"

[embedding]
provider = "openai"
base_url = "env:EMBEDDER_BASE_URL"
api_key = "env:EMBEDDER_API_KEY"
model = "env:EMBEDDER_MODEL"
dimension = "env:EMBEDDER_DIMENSION"
cache_size = 10000
